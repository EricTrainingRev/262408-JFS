<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating &amp; Removing Elements — Building UI with JavaScript</title>
    <style>
        /* Minimal styling so the page is readable while you experiment. */
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
            color: #212121;
            line-height: 1.5;
        }
        .note {
            background: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 10px 14px;
            border-radius: 4px;
        }
        code {
            background: #eceff1;
            padding: 2px 6px;
            border-radius: 4px;
        }
        button {
            font: inherit;
            padding: 6px 12px;
            margin: 4px 4px 4px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #f1f3f4;
        }
        .demo-box {
            border: 2px dashed #1a73e8;
            padding: 8px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <h1>Creating &amp; removing elements: building UI with JavaScript</h1>

    <p class="note">
        This page is interactive. Click the buttons to add and remove
        boxes. The JavaScript lives in <code>create-remove.js</code> —
        read its comments for the details.
    </p>

    <!--
        JavaScript can build new parts of the UI on the fly. The recipe
        is: create the element, configure it, then inject it into the
        page. The buttons below demonstrate creating, appending,
        prepending, and removing elements.
    -->
    <h2>Try it</h2>
    <p>
        <button id="createElement">Create &amp; append a box</button>
        <button id="prependElement">Prepend a box</button>
        <button id="removeFirstBox">Remove first box</button>
    </p>
    <div class="demo-box" id="boxContainer">
        <p>Boxes will appear here.</p>
    </div>

    <script src="create-remove.js"></script>
</body>
</html>
