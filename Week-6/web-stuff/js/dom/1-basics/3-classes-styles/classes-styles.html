<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes &amp; Styles — Styling Elements from JavaScript</title>
    <style>
        /* Minimal styling so the page is readable while you experiment. */
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
            color: #212121;
            line-height: 1.5;
        }
        .note {
            background: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 10px 14px;
            border-radius: 4px;
        }
        code {
            background: #eceff1;
            padding: 2px 6px;
            border-radius: 4px;
        }
        button {
            font: inherit;
            padding: 6px 12px;
            margin: 4px 4px 4px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        button:hover {
            background: #f1f3f4;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px 16px;
            margin: 12px 0;
        }
        /* The class the toggle button adds and removes. */
        .highlight {
            background: #fef7e0;
            border-left: 4px solid #f9ab00;
        }
    </style>
</head>
<body>
    <h1>Classes &amp; styles: styling elements from JavaScript</h1>

    <p class="note">
        This page is interactive. Click the buttons and watch the card
        below change. The JavaScript lives in <code>classes-styles.js</code>
        — read its comments for the details.
    </p>

    <!--
        There are two ways to change how an element looks from JavaScript:
        toggling CSS CLASSES (the preferred approach) and setting INLINE
        STYLES directly. The buttons below demonstrate both.
    -->
    <h2>Try it</h2>
    <p>
        <button id="toggleClass">Toggle .highlight class</button>
        <button id="changeColor">Toggle background color</button>
    </p>
    <div class="card" id="styleCard">
        <p>This card's class and background color can change.</p>
    </div>

    <script src="classes-styles.js"></script>
</body>
</html>
