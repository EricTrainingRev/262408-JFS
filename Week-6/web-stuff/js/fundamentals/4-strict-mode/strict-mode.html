<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Mode — Sloppy vs. Strict</title>
    <style>
        /* Minimal styling: this page's real output lives in the browser console. */
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
            color: #212121;
        }
        .note {
            background: #e8f0fe;
            border-left: 4px solid #1a73e8;
            padding: 10px 14px;
            border-radius: 4px;
        }
        code {
            background: #eceff1;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Strict mode: sloppy vs. strict</h1>

    <!--
        This is a "workspace" page: it exists only to run JavaScript and print
        the results to the browser console. Open the console to see the output.

        How to open the console:
          - Chrome / Edge / Firefox: press F12, then click the "Console" tab.
          - Safari: press Cmd+Option+J.

        The code lives in strict-mode.js, linked below. It demonstrates the
        difference between "sloppy" mode (the default) and strict mode.

        Because "use strict" applies to the WHOLE file, this demo uses
        function-level strict mode: a sloppy function and a strict function
        side by side, so you can see the contrast in one script.

        Strict mode turns silent failures into loud errors:
          1. Assigning to an undeclared variable
          2. The value of `this` in a plain function call
          3. Assigning to a read-only property
          4. Duplicate parameter names
    -->
    <p class="note">
        Open the browser console (F12) to see the output of this page's script.
    </p>

    <!-- Load the JavaScript that prints the demos to the console. -->
    <script src="strict-mode.js"></script>
</body>
</html>
