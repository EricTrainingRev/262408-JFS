<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Polish</title>
    <link rel="stylesheet" href="polish.css">
</head>
<body>
    <h1>Static polish</h1>

    <!-- opacity makes the whole element partly transparent.
         The text fades, and the page shows through faintly. -->
    <p class="framed p-opacity">I am at 60% opacity, so the page shows through faintly.</p>

    <!-- cursor changes the pointer shape over the element.
         Move your pointer over this box: it becomes a hand. -->
    <p class="framed p-cursor">Hover your pointer over me: it becomes a hand (pointer).</p>
</body>
</html>
