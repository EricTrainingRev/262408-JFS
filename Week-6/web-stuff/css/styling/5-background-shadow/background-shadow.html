<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background and Shadow</title>
    <link rel="stylesheet" href="background-shadow.css">
</head>
<body>
    <h1>Background and shadow</h1>

    <!-- background-color fills behind the content with a flat color. -->
    <p class="bg-color padded">A flat background-color fill.</p>

    <!-- background-image with a gradient blends two colors instead. -->
    <p class="bg-gradient padded">A gradient background-image blends colors.</p>

    <!-- box-shadow casts a soft drop shadow around the box. -->
    <p class="b-shadow padded">A box-shadow lifts my edge off the page.</p>
</body>
</html>
