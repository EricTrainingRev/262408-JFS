<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elements</title>
    <link rel="stylesheet" href="pseudo-elements.css">
</head>
<body>
    <h1>Pseudo-elements (two colons)</h1>

    <!-- ::first-letter styles just the first letter of the paragraph,
         like a decorative drop cap in a book. -->
    <p class="dropcap">First letters get extra treatment: here the opening letter is larger and bold.</p>

    <!-- ::before inserts content just before the element. The checkmark is
         generated by CSS, not typed in the HTML. -->
    <p class="badge">This line has a checkmark inserted by ::before.</p>

    <!-- ::placeholder colors the hint text inside a field. Type something to
         see the real text use the default color instead. -->
    <p><input class="field" type="text" placeholder="Hint text is green"></p>
</body>
</html>
