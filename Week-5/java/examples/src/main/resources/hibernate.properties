# =============================================================================
# hibernate.properties
# -----------------------------------------------------------------------------
# This is the ACTIVE configuration file for this project. When the application
# builds its SessionFactory it reads THIS file (see HibernateUtil), NOT the
# hibernate.cfg.xml that also lives in this folder.
#
# Why? Hibernate automatically looks for a file named "hibernate.properties"
# on the classpath when you create a Configuration. Because we deliberately do
# not call .configure() (which is what would load hibernate.cfg.xml), this
# properties file is the single source of truth for our connection settings.
# The XML file is kept alongside purely as a reference/example of the
# alternative XML-based style.
# =============================================================================

# --- JDBC connection settings ------------------------------------------------
# Which JDBC driver to use. H2 ships with the driver class below.
hibernate.connection.driver_class=org.h2.Driver

# Connection URL for an in-memory H2 database named "testdb".
# In-memory DBs live only for the lifetime of the JVM -- perfect for a demo or when testing.
hibernate.connection.url=jdbc:h2:mem:testdb

# H2's default username/password (password is empty).
hibernate.connection.username=sa
hibernate.connection.password=

# --- Schema / DDL behaviour --------------------------------------------------
# Hibernate can perform DDL operations for us at startup:
# - none:         Hibernate performs no action
# - validate:     Hibernate checks that your entities match the schema of the database
# - update*:      Hibernate alters tables (only adding, no removing) to match your entities
# - create*:      Hibernate drops any pre-existing tables and creates them to match your entities
# - create-drop*: Hibernate creates the schema from your entities on startup and
#                 drops it when the SessionFactory closes. Ideal for testing.
hibernate.hbm2ddl.auto=create-drop

# --- Logging / readability ---------------------------------------------------
# Print the generated SQL to the console so you can see what Hibernate does.
hibernate.show_sql=true

# Pretty-print (indent) the generated SQL for easier reading.
hibernate.format_sql=true

# --- Dialect -----------------------------------------------------------------
# Hibernate 7 auto-detects the dialect from the JDBC driver, so this is
# technically optional. However, if for whatever reason Hibernate can not
# detect your driver or determine your dialect it will use a generic SQL implementation
# that may lead to unexpected results
hibernate.dialect=org.hibernate.dialect.H2Dialect